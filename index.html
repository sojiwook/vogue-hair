<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D9602B" />
    <title>소감 SOGAM</title>

    <!-- Pretendard — 한글 UI 전용 서체. Noto Sans KR보다 자간·획 대비가 정돈돼 있어
         숫자와 한글이 섞인 리포트에서 훨씬 깔끔하게 읽힌다.
         CDN이 막히면 아래 폰트 스택이 순서대로 대체된다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <style>
      :root {
        --sogam-font: "Pretendard Variable", Pretendard, -apple-system,
          BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR",
          system-ui, sans-serif;
      }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--sogam-font);
        /* 숫자 폭을 고정해 점수가 바뀔 때 자리가 흔들리지 않게 한다 */
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
